name: Release APK
# Publishes a GitHub Release for the versionName in app/build.gradle.kts the first time it is pushed to main
# (no manual tag needed). Re-run from the Actions tab with "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version and whether it is new
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -E 'versionName *=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$ver" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.new == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: steps.v.outputs.new == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - if: steps.v.outputs.new == 'true'
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk "SUDOPLAY-${{ steps.v.outputs.ver }}.apk"
      - if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: SUDOPLAY ${{ steps.v.outputs.ver }}
          files: SUDOPLAY-${{ steps.v.outputs.ver }}.apk
          generate_release_notes: true
